<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Builder V2 - Party Player</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000; color: #fff; font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #player1 {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }
    #overlay {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(0, 0, 0, 0.85); padding: 15px 20px; border-radius: 8px;
      border: 1px solid #ff2a00; max-width: 320px; pointer-events: none;
    }
    h2 { margin: 0 0 5px 0; font-size: 16px; color: #ff2a00; }
    p { margin: 0; font-size: 13px; color: #ccc; }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>Playlist Builder V2</h2>
    <p id="status">Cargando reproductor de YouTube...</p>
  </div>

  <div id="player1"></div>

  <!-- Carga de la API oficial de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js"></script>
</body>
</html>
