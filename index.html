<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="player-container">
        <div id="playerA"></div>
        <div id="playerB" style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
    </div>

    <div id="controls-overlay">
        <div id="status">Cargando reproductor...</div>
        <button id="playlist-btn">≡ Playlist (0)</button>
    </div>

    <div id="playlist-container" style="display: none;">
        <div id="playlist-header">
            <span>Crossfade: <strong id="fade-info">10s</strong></span>
        </div>
        <div id="playlist-items"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="player.js"></script>
</body>
</html>
