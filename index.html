<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Player</title>

    <!-- ÍCONO DEL SITIO -->
    <link rel="icon" type="image/png" href="logo.png?v=2">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; }
        
        #player-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        } 
        
        #playerA, #playerB { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        #playerA { z-index: 2; pointer-events: auto; }
        #playerB { z-index: 1; pointer-events: none; opacity: 0; }

        /* Capa transparente para bloquear sugeridos/recomendados */
        .yt-blocker-corner {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 250px;
            height: 120px;
            z-index: 999;
            pointer-events: none !important;
            background: transparent;
        }

        /* BARRA SUPERIOR DE ESTADO Y VINILOS CON FADE OUT SUAVE */
        #top-status-bar {
            position: fixed;
            top: 60px;
            left: 20px;
            z-index: 9999;
            pointer-events: none;
            display: inline-block;
            max-width: calc(100vw - 400px);
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        /* Oculta todo el bloque (texto y discos juntos) */
        #top-status-bar.fade-out {
            opacity: 0 !important;
        }

        #status { 
            background: rgba(0,0,0,0.85); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
            position: relative;
            width: 100%;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        /* CONTENEDOR DE VINILOS */
        #vinyl-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            margin-top: 10px;
            box-sizing: border-box;
            padding: 0 5px;
        }

        #vinyl-container.active {
            opacity: 1;
        }

        /* Discos 105px */
        .vinyl-wrapper {
            width: 105px !important;
            height: 105px !important;
            min-width: 105px;
            min-height: 105px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl {
            width: 105px !important;
            height: 105px !important;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            animation: spinVinyl 2.5s linear infinite;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.9));
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* CONTENEDOR DE PLAYLIST A LA DERECHA */
        #playlist-wrapper {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
        }

        #playlist-btn { 
            pointer-events: auto; 
            background: #ff2a00; 
            color: #fff; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #playlist-container { 
            pointer-events: auto;
            width: 340px; 
            max-height: calc(100vh - 120px); 
            background: rgba(18,18,18,0.95); 
            border: 1px solid #333;
            border-radius: 12px; 
            padding: 12px; 
            display: none; 
            flex-direction: column; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        #playlist-header { font-size: 11px; color: #aaa; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #333; }
        #playlist-items { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; position: relative; }

        .playlist-item { 
            background: #282828; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            color: #eee; 
            cursor: grab; 
            user-select: none;
            position: relative;
            transition: background 0.2s;
            box-sizing: border-box;
        } 
        
        .playlist-item:hover { background: #383838; }
        .playlist-item.active { background: #ff2a00; color: #fff; font-weight: bold; }
        .playlist-item.dragging { opacity: 0.3; }

        /* LÍNEA ROJA GUÍA MEDIANTE PSEUDO-ELEMENTOS (NO FALLA CON BORDES) */
        .playlist-item.drag-over-top::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #ff2a00;
            border-radius: 2px;
            z-index: 1000;
            box-shadow: 0 0 6px rgba(255, 42, 0, 0.8);
        }

        .playlist-item.drag-over-bottom::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #ff2a00;
            border-radius: 2px;
            z-index: 1000;
            box-shadow: 0 0 6px rgba(255, 42, 0, 0.8);
        }

        .cf-outgoing { color: #aaa; }
        .cf-incoming { color: #00e5ff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="playerA"></div>
        <div id="playerB"></div>
    </div>

    <div class="yt-blocker-corner"></div>

    <div id="top-status-bar">
        <div id="status">Inicializando...</div>
        
        <!-- CONTENEDOR DE VINILOS -->
        <div id="vinyl-container">
            <div class="vinyl-wrapper outgoing">
                <img id="vinyl-outgoing" class="vinyl" alt="" />
            </div>
            <div class="vinyl-wrapper incoming">
                <img id="vinyl-incoming" class="vinyl" alt="" />
            </div>
        </div>
    </div>

    <div id="playlist-wrapper">
        <button id="playlist-btn">≡ Playlist (0)</button>
        <div id="playlist-container">
            <div id="playlist-header">
                <span>Crossfade: <strong id="fade-info">10s</strong></span>
            </div>
            <div id="playlist-items"></div>
        </div>
    </div>

    <!-- Script de inyección directa de imágenes -->
    <script>
        (function() {
            function loadImages() {
                const redImg = document.getElementById('vinyl-outgoing');
                const blueImg = document.getElementById('vinyl-incoming');
                if (redImg && blueImg) {
                    if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.getURL) {
                        redImg.src = chrome.runtime.getURL('rojo.png');
                        blueImg.src = chrome.runtime.getURL('azul.png');
                    } else {
                        redImg.src = 'rojo.png';
                        blueImg.src = 'azul.png';
                    }
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadImages);
            } else {
                loadImages();
            }
        })();
    </script>

    <!-- Script principal integrado -->
    <script>
        const CROSSFADE_SECONDS = 10;

        function acortarTexto(texto, max = 40) {
            if (!texto) return '';
            return texto.length > max ? texto.substring(0, max) + '...' : texto;
        }

        function ejecutarTransicionVisual(cancionSaliendo, cancionEntrando) {
            const topStatusBar = document.getElementById('top-status-bar');
            const statusElem = document.getElementById('status');
            const vinylContainer = document.getElementById('vinyl-container');
            
            const txtSaliendo = acortarTexto(cancionSaliendo, 40);
            const txtEntrando = acortarTexto(cancionEntrando, 40);

            // 1. Mostrar estado y vinilos
            topStatusBar.classList.remove('fade-out');

            statusElem.innerHTML = `
                <div class="status-section cf-outgoing">▼ Saliendo: ${txtSaliendo}</div>
                <div class="status-section cf-incoming">▲ Entrando: ${txtEntrando}</div>
            `;

            vinylContainer.classList.add('active');

            const duracionMs = CROSSFADE_SECONDS * 1000;

            // 2. Un segundo antes de terminar, iniciar Fade Out completo
            setTimeout(() => {
                topStatusBar.classList.add('fade-out');
            }, Math.max(0, duracionMs - 1200));

            // 3. Al finalizar, cambiar a "Sonando" y reaparecer suavemente
            setTimeout(() => {
                vinylContainer.classList.remove('active');
                statusElem.innerHTML = `▶ Sonando: ${txtEntrando}`;
                topStatusBar.classList.remove('fade-out');
            }, duracionMs);
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="player.js"></script>
</body>
</html>
