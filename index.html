<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Builder V2 - Party Player</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Contenedores de los dos reproductores para el Crossfade */
    .player-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transition: opacity 1.5s ease-in-out;
      border: none;
    }
    #playerA { z-index: 2; opacity: 1; }
    #playerB { z-index: 1; opacity: 0; }

    /* Botón flotante para abrir/cerrar Playlist */
    #toggle-playlist-btn {
      position: absolute; top: 20px; right: 20px; z-index: 100;
      background: #ff2a00; color: #fff; border: none; padding: 10px 18px;
      font-weight: bold; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 42, 0, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    #toggle-playlist-btn:hover { transform: scale(1.05); background: #e02500; }

    /* Panel Lateral de Playlist */
    #playlist-panel {
      position: absolute; top: 0; right: -350px; width: 340px; height: 100%;
      background: rgba(12, 12, 14, 0.92); backdrop-filter: blur(10px);
      z-index: 90; border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px; display: flex; flex-direction: column;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #playlist-panel.open { right: 0; }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px;
    }
    .panel-header h3 { margin: 0; font-size: 18px; color: #ff2a00; }
    .crossfade-info { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* Lista de canciones */
    #playlist-items {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      padding-right: 4px;
    }
    #playlist-items::-webkit-scrollbar { width: 6px; }
    #playlist-items::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .playlist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.05);
      cursor: pointer; transition: background 0.2s;
    }
    .playlist-item:hover { background: rgba(255, 255, 255, 0.15); }
    .playlist-item.active {
      background: rgba(255, 42, 0, 0.2); border-left: 4px solid #ff2a00;
    }
    .item-number { font-weight: bold; font-size: 13px; color: #888; width: 20px; }
    .playlist-item.active .item-number { color: #ff2a00; }
    .item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    /* Cartel flotante de estado */
    #status-overlay {
      position: absolute; top: 20px; left: 20px; z-index: 80;
      background: rgba(0, 0, 0, 0.75); padding: 12px 18px; border-radius: 8px;
      border-left: 4px solid #ff2a00; pointer-events: none;
    }
    #status-overlay h4 { margin: 0 0 4px 0; font-size: 14px; color: #fff; }
    #status-overlay p { margin: 0; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>

  <!-- Mensaje flotante de estado -->
  <div id="status-overlay">
    <h4>Playlist Builder V2</h4>
    <p id="status">Iniciando sistema de audio...</p>
  </div>

  <!-- Botón abrir/cerrar lista -->
  <button id="toggle-playlist-btn">☰ Playlist (<span id="count-badge">0</span>)</button>

  <!-- Panel lateral con la lista de reproducción -->
  <div id="playlist-panel">
    <div class="panel-header">
      <div>
        <h3>Lista de Reproducción</h3>
        <div class="crossfade-info" id="fade-info">Crossfade: 10s</div>
      </div>
    </div>
    <div id="playlist-items"></div>
  </div>

  <!-- Los 2 reproductores dobles para lograr el Crossfade -->
  <div id="playerA" class="player-container"></div>
  <div id="playerB" class="player-container"></div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js"></script>
</body>
</html>
