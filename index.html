<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Playlist Builder V2 - Party Player</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: Arial, sans-serif; color: white; }
    #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; border: 1px solid #333; }
    h2 { margin: 0 0 5px 0; font-size: 16px; color: #ff0000; }
    p { margin: 0; font-size: 14px; color: #ccc; }
    
    .deck-container { position: relative; width: 100vw; height: 100vh; }
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 1s linear; z-index: 1; pointer-events: none; }
    iframe.active { opacity: 1; z-index: 2; pointer-events: auto; }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 100; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    #start-btn {
      padding: 16px 32px; font-size: 18px; background: #ff0000;
      color: white; border: none; border-radius: 8px; cursor: pointer;
      font-weight: bold; transition: transform 0.2s, background 0.2s;
    }
    #start-btn:hover { background: #cc0000; transform: scale(1.05); }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1 style="margin-bottom: 10px;">Playlist Builder V2</h1>
    <p style="color: #aaa; margin-bottom: 25px;">Haz clic para activar el reproductor con crossfade</p>
    <button id="start-btn">▶ INICIAR FIESTA</button>
  </div>

  <div id="ui">
    <h2>Playlist Builder V2</h2>
    <p id="status">Esperando inicio...</p>
  </div>

  <div class="deck-container">
    <iframe id="frameA" class="active" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <iframe id="frameB" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <script src="player.js"></script>
</body>
</html>
