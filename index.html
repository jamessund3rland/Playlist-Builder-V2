<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; }
        #player-container { position: relative; width: 100vw; height: 100vh; }
        #playerA, #playerB { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #controls-overlay { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #status { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; font-size: 12px; }
        #playlist-btn { background: #ff2a00; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #playlist-container { position: fixed; bottom: 20px; right: 20px; width: 280px; max-height: 350px; background: rgba(18,18,18,0.95); border-radius: 12px; padding: 12px; z-index: 9998; display: none; flex-direction: column; }
        #playlist-header { font-size: 11px; color: #aaa; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #333; }
        #playlist-items { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .playlist-item { background: #282828; padding: 10px; border-radius: 6px; font-size: 12px; color: #eee; cursor: pointer; }
        .playlist-item.active { background: #ff2a00; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="playerA"></div>
        <div id="playerB" style="opacity: 0;"></div>
    </div>

    <div id="controls-overlay">
        <div id="status">Cargando reproductor...</div>
        <button id="playlist-btn">≡ Playlist (0)</button>
    </div>

    <div id="playlist-container">
        <div id="playlist-header">
            <span>Crossfade: <strong id="fade-info">10s</strong></span>
        </div>
        <div id="playlist-items"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="player.js"></script>
</body>
</html>
