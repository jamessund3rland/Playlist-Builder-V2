<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Builder V2 - Party Player</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Reproductores para Crossfade */
    .player-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transition: opacity 1.5s ease-in-out; border: none;
    }
    #playerA { z-index: 2; opacity: 1; }
    #playerB { z-index: 1; opacity: 0; }

    /* Header flotante con LOGO e info */
    #brand-header {
      position: absolute; top: 20px; left: 20px; z-index: 80;
      display: flex; align-items: center; gap: 12px;
      background: rgba(0, 0, 0, 0.85); padding: 10px 16px; border-radius: 10px;
      border-left: 4px solid #ff2a00; backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #brand-logo {
      width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
      border: 1px solid #ff2a00;
    }
    .brand-text h4 { margin: 0 0 2px 0; font-size: 14px; color: #fff; }
    .brand-text p { margin: 0; font-size: 11px; color: #aaa; }

    /* Botón flotante para abrir/cerrar lista */
    #toggle-playlist-btn {
      position: absolute; top: 20px; right: 20px; z-index: 100;
      background: #ff2a00; color: #fff; border: none; padding: 10px 18px;
      font-weight: bold; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 42, 0, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    #toggle-playlist-btn:hover { transform: scale(1.05); background: #e02500; }

    /* Panel lateral con Lista */
    #playlist-panel {
      position: absolute; top: 0; right: -380px; width: 370px; height: 100%;
      background: rgba(12, 12, 14, 0.94); backdrop-filter: blur(12px);
      z-index: 90; border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px; display: flex; flex-direction: column;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #playlist-panel.open { right: 0; }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px;
    }
    .panel-header h3 { margin: 0; font-size: 18px; color: #ff2a00; }
    .crossfade-info { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* Lista de Items */
    #playlist-items {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      padding-right: 4px; position: relative;
    }
    #playlist-items::-webkit-scrollbar { width: 6px; }
    #playlist-items::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .playlist-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.05);
      cursor: grab; transition: background 0.2s, transform 0.1s;
      user-select: none; position: relative;
    }
    .playlist-item:active { cursor: grabbing; }
    .playlist-item:hover { background: rgba(255, 255, 255, 0.12); }
    .playlist-item.active {
      background: rgba(255, 42, 0, 0.25); border-left: 4px solid #ff2a00;
    }
    .playlist-item.dragging { opacity: 0.3; }

    /* Línea roja indicadora de posición de destino */
    .playlist-item.drag-over-top {
      border-top: 3px solid #ff2a00 !important;
    }
    .playlist-item.drag-over-bottom {
      border-bottom: 3px solid #ff2a00 !important;
    }

    .drag-handle { color: #666; font-size: 14px; cursor: grab; padding-right: 2px; }
    .item-number { font-weight: bold; font-size: 12px; color: #777; width: 22px; text-align: center; }
    .playlist-item.active .item-number { color: #ff2a00; }
    .item-title { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  </style>
</head>
<body>

  <!-- Logo e Información de reproducción -->
  <div id="brand-header">
    <img id="brand-logo" src="https://raw.githubusercontent.com/jamessund3rland/Playlist-Builder-V2/main/logo.png" alt="Logo" onerror="this.style.display='none'">
    <div class="brand-text">
      <h4>Playlist Builder V2</h4>
      <p id="status">Iniciando sistema de audio...</p>
    </div>
  </div>

  <button id="toggle-playlist-btn">☰ Playlist (<span id="count-badge">0</span>)</button>

  <div id="playlist-panel">
    <div class="panel-header">
      <div>
        <h3>Lista de Reproducción</h3>
        <div class="crossfade-info" id="fade-info">Crossfade: 10s</div>
      </div>
    </div>
    <div id="playlist-items"></div>
  </div>

  <div id="playerA" class="player-container"></div>
  <div id="playerB" class="player-container"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="player.js"></script>
</body>
</html>
