<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Player</title>

    <!-- ÍCONO DEL SITIO -->
    <link rel="icon" type="image/png" href="logo.png?v=2">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; }
        
        #player-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        } 
        
        #playerA, #playerB { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        #playerA { z-index: 2; pointer-events: auto; }
        #playerB { z-index: 1; pointer-events: none; opacity: 0; }

        /* FIX 1: Desactivar los eventos para que la esquina permita hacer clic en la linea de tiempo y pantalla completa */
        .yt-blocker-corner {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 250px;
            height: 120px;
            z-index: 999;
            pointer-events: none !important;
            background: transparent;
        }

        /* BARRA SUPERIOR DE ESTADO Y VINILOS */
        #top-status-bar {
            position: fixed;
            top: 60px;
            left: 20px;
            right: 380px; /* Para abarcar todo el ancho hasta la lista */
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        #status { 
            background: rgba(0,0,0,0.85); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            pointer-events: auto;
            display: inline-block;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
        }

        /* FIX 2: Vinilos a cada extremo (uno a la izquierda y otro a la derecha) */
        #vinyl-container {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            margin-top: 5px;
            padding: 0 20px;
        }

        #vinyl-container.active {
            opacity: 1;
        }

        /* FIX 3: Discos 250% más grandes (pasaron de 70px a 175px) */
        .vinyl-wrapper {
            width: 175px !important;
            height: 175px !important;
            min-width: 175px;
            min-height: 175px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl {
            width: 175px !important;
            height: 175px !important;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            animation: spinVinyl 2.5s linear infinite;
            filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.9));
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* CONTENEDOR DE PLAYLIST A LA DERECHA */
        #playlist-wrapper {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
        }

        #playlist-btn { 
            pointer-events: auto; 
            background: #ff2a00; 
            color: #fff; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #playlist-container { 
            pointer-events: auto;
            width: 340px; 
            max-height: calc(100vh - 120px); 
            background: rgba(18,18,18,0.95); 
            border: 1px solid #333;
            border-radius: 12px; 
            padding: 12px; 
            display: none; 
            flex-direction: column; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        #playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #333;
        }
        #playlist-items { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; }

        /* Botón rojo para releer la carpeta de marcadores sin reiniciar todo */
        #refresh-playlist-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            min-width: 24px;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        #refresh-playlist-btn:hover { background: #cc0000; }
        #refresh-playlist-btn.spinning { animation: spinRefresh 0.6s linear; }
        @keyframes spinRefresh { to { transform: rotate(360deg); } }

        .playlist-item { 
            background: #282828; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            color: #eee; 
            cursor: grab; 
            user-select: none;
            position: relative;
            transition: background 0.2s;
        } 
        
        .playlist-item:hover { background: #383838; }
        .playlist-item.active { background: #ff2a00; color: #fff; font-weight: bold; }
        .playlist-item.dragging { opacity: 0.3; }

        /* Línea roja indicadora de dónde quedará el track al soltarlo */
        .playlist-item.drop-indicator-above::before,
        .playlist-item.drop-indicator-below::after {
            content: '';
            position: absolute;
            left: 4px;
            right: 4px;
            height: 6px;
            background: #ff0000;
            border-radius: 3px;
            box-shadow: 0 0 9px 2px rgba(255, 0, 0, 1), 0 0 16px 4px rgba(255, 0, 0, 0.6);
            pointer-events: none;
        }
        .playlist-item.drop-indicator-above::before { top: -5px; }
        .playlist-item.drop-indicator-below::after { bottom: -5px; }

        .cf-outgoing { color: #aaa; }
        .cf-incoming { color: #00e5ff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="playerA"></div>
        <div id="playerB"></div>
    </div>

    <div class="yt-blocker-corner"></div>

    <div id="top-status-bar">
        <div id="status">Inicializando...</div>
        
        <!-- CONTENEDOR DE VINILOS -->
        <div id="vinyl-container">
            <div class="vinyl-wrapper">
                <img id="vinyl-outgoing" class="vinyl" alt="" />
            </div>
            <div class="vinyl-wrapper">
                <img id="vinyl-incoming" class="vinyl" alt="" />
            </div>
        </div>
    </div>

    <div id="playlist-wrapper">
        <button id="playlist-btn">≡ Playlist (0)</button>
        <div id="playlist-container">
            <div id="playlist-header">
                <span>Crossfade: <strong id="fade-info">10s</strong></span>
                <button id="refresh-playlist-btn" title="Actualizar playlist desde la carpeta de marcadores">⟳</button>
            </div>
            <div id="playlist-items"></div>
        </div>
    </div>

    <!-- Script de inyección directa de rutas de extensión -->
    <script>
        (function() {
            function loadImages() {
                const redImg = document.getElementById('vinyl-outgoing');
                const blueImg = document.getElementById('vinyl-incoming');
                if (redImg && blueImg) {
                    if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.getURL) {
                        redImg.src = chrome.runtime.getURL('rojo.png');
                        blueImg.src = chrome.runtime.getURL('azul.png');
                    } else {
                        redImg.src = 'rojo.png';
                        blueImg.src = 'azul.png';
                    }
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadImages);
            } else {
                loadImages();
            }
        })();
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="player.js"></script>
</body>
</html>
